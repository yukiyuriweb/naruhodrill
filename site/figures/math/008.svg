  <g stroke="#ccc" stroke-width="1">
    <line x1="50" y1="212" x2="380" y2="212"/><line x1="50" y1="188" x2="380" y2="188"/><line x1="50" y1="164" x2="380" y2="164"/>
    <line x1="50" y1="140" x2="380" y2="140"/><line x1="50" y1="116" x2="380" y2="116"/><line x1="50" y1="92" x2="380" y2="92"/>
    <line x1="50" y1="68" x2="380" y2="68"/><line x1="50" y1="44" x2="380" y2="44"/>
  </g>
  <line x1="50" y1="30" x2="50" y2="236" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="236" x2="380" y2="236" stroke="#333" stroke-width="2"/>
