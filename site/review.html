<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>問題の確認 - なるほドリル</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* 作問の確認用（ローカル専用。公開用の dist/ には入れない） */
  body { font-size: 15px; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; max-width: 1500px; margin: 0 auto; padding: 0 16px 60px; }
  nav { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; padding: 12px 0; font-size: 14px; }
  nav .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  nav .tabs .on { background: var(--accent); color: #fff; border-color: var(--accent); }
  nav ol { margin: 0; padding-left: 0; list-style: none; }
  nav li a { display: block; padding: 3px 6px; border-radius: 6px; color: var(--fg); text-decoration: none; }
  nav li a.cur { background: var(--accent-soft); }
  nav .keys { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .tag { white-space: nowrap; font-size: 11px; border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .tag.draft { background: #eee; color: #666; }
  .tag.published { background: #e2f5ea; color: var(--ok); }
  .card { border-top: 3px solid var(--warm); padding: 14px 0 28px; scroll-margin-top: 0; }
  .card h2 { margin: 0 0 8px; font-size: 20px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card h2 .meta { font-size: 13px; font-weight: normal; color: var(--muted); }
  .card h2 a { font-size: 13px; font-weight: normal; }
  .cols { display: grid; grid-template-columns: 640px 1fr; gap: 20px; align-items: start; }
  .info { line-height: 1.7; }
  .info h3 { font-size: 14px; margin: 12px 0 2px; color: var(--muted); }
  .info h3:first-child { margin-top: 0; }
  .info ol, .info ul { margin: 0; padding-left: 1.4em; }
  .info table { border-collapse: collapse; width: 100%; }
  .info td { border-bottom: 1px solid var(--line); padding: 3px 6px; vertical-align: top; }
  .info td.v { width: 30%; font-weight: bold; color: var(--ng); }
  .info .ans b { color: var(--ok); }
  .info .note p { margin: 0 0 6px; }
  .card h2 .toggle { font-size: 13px; padding: 3px 10px; }
  #bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="layout">
  <nav>
    <div class="tabs" id="tabs"></div>
    <ol id="toc"></ol>
    <div class="keys">j / k：次・前の問題<br>s：この問題を解く<br>p：公開・下書きを切り替える</div>
  </nav>
  <main id="main"></main>
  <div id="bar" hidden></div>
</div>
<script type="module">
import { SUBJECTS, IS_LOCAL, richText, loadIndex, loadProblem, problemUrl } from "./js/common.js";
import { renderSheet, answerText } from "./js/sheet.js";

const $ = (s) => document.querySelector(s);
if (!IS_LOCAL) {
  document.body.innerHTML = `<p style="padding:24px">このページは作問の確認用です（ローカルでだけ使えます）。<a href="./">もどる</a></p>`;
  throw new Error("local only");
}

const params = new URLSearchParams(location.search);
const subject = SUBJECTS[params.get("s")] ? params.get("s") : "math";
// 確認用なので、タブは漢字で短く（子ども向けのページは SUBJECTS のひらがなのまま）
const LABELS = { math: "算数", kokugo: "国語", logic: "論理", spatial: "空間" };
$("#tabs").innerHTML = Object.keys(SUBJECTS)
  .map((k) => `<a class="btn ${k === subject ? "on" : ""}" href="?s=${k}">${LABELS[k] || SUBJECTS[k]}</a>`).join("");

const list = (await loadIndex())[subject] || [];
const problems = await Promise.all(list.map((x) => loadProblem(subject, x.id)));
const tag = (st, id) => `<span class="tag ${st}" data-tag="${id}">${st === "draft" ? "下書き" : "公開"}</span>`;

$("#toc").innerHTML = problems.map((p) =>
  `<li><a href="#p${p.id}" data-id="${p.id}">${Number(p.id)}. ${richText(p.title)}${tag(p.status, p.id)}</a></li>`).join("");

const li = (arr) => arr.map((t) => `<li>${richText(t)}</li>`).join("");
$("#main").innerHTML = problems.map((p) => `
  <section class="card" id="p${p.id}">
    <h2>${Number(p.id)}. ${richText(p.title)}${tag(p.status, p.id)}
      <button class="btn toggle" data-id="${p.id}"></button>
      <span class="meta">${richText(p.lv)}・${richText(p.area)}・ヒント ${p.hint_interval_min} 分ごと${p.layout ? `・${p.layout}` : ""}</span>
      <a href="${problemUrl(subject, p.id)}&fast=1" target="_blank">解く</a>
      <span class="meta">data/${subject}/${p.id}.json</span>
    </h2>
    <div class="cols">
      <div class="sheet-slot"></div>
      <div class="info">
        <h3>こたえ</h3>
        <div class="ans">${p.parts.map((x) => `${richText(x.label)} <b>${richText(answerText(x))}</b>`).join("　")}</div>
        <h3>ヒント</h3><ol>${li(p.hints)}</ol>
        <h3>よくある間違い</h3>
        <table>${(p.mistakes || []).map((m) =>
          `<tr><td>${richText(p.parts[m.part].label)}</td><td class="v">${richText(p.parts[m.part].choices?.find((c) => c.value === String(m.value))?.label ?? String(m.value))}</td><td>${richText(m.message)}</td></tr>`).join("")}</table>
        <h3>解説</h3><ol>${li(p.explanation)}</ol>
        <h3>おうちの方へ</h3><div class="note">${(p.parent_note || []).map((t) => `<p>${richText(t)}</p>`).join("")}</div>
      </div>
    </div>
  </section>`).join("");

// 紙は正解を入れて、○を付けた状態で出す
document.querySelectorAll(".sheet-slot").forEach((slot, i) => {
  const p = problems[i];
  renderSheet(slot, p, {
    width: Math.min(640, slot.clientWidth || 640), editable: false,
    answers: p.parts.map((x) => String(x.answer.value)), marks: p.parts.map(() => true),
  });
});

// 公開・下書きの切り替え（tools/serve.py が JSON を書き換える）
const paint = (p) => {
  document.querySelectorAll(`[data-tag="${p.id}"]`).forEach((el) => (el.outerHTML = tag(p.status, p.id)));
  const b = document.querySelector(`.toggle[data-id="${p.id}"]`);
  b.textContent = p.status === "draft" ? "公開にする" : "下書きにもどす";
  b.classList.toggle("primary", p.status === "draft");
};
problems.forEach(paint);
document.querySelectorAll(".toggle").forEach((b) => (b.onclick = async () => {
  const p = problems.find((x) => x.id === b.dataset.id);
  const status = p.status === "draft" ? "published" : "draft";
  b.disabled = true;
  try {
    const r = await fetch("api/status", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subject, id: p.id, status }) });
    if (!r.ok) throw new Error(r.status);
    p.status = status;
    paint(p);
  } catch (e) {
    alertBar(r501(e) ? "切り替えるには、uv run site/tools/serve.py でサーバーを起動してください" : `切り替えられませんでした（${e.message}）`);
  } finally {
    b.disabled = false;
  }
}));
const r501 = (e) => ["501", "404", "405"].includes(e.message);
function alertBar(text) {
  $("#bar").textContent = text;
  $("#bar").hidden = false;
  clearTimeout(alertBar.t);
  alertBar.t = setTimeout(() => ($("#bar").hidden = true), 6000);
}

// 目次の今いる問題を強調し、j / k で移動
const cards = [...document.querySelectorAll(".card")];
const current = () => {
  const y = window.scrollY + 40;
  return Math.max(0, cards.findLastIndex((c) => c.offsetTop <= y));
};
const highlight = () => {
  const id = problems[current()]?.id;
  document.querySelectorAll("#toc a").forEach((a) => a.classList.toggle("cur", a.dataset.id === id));
};
window.addEventListener("scroll", highlight, { passive: true });
highlight();
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = current();
  if (e.key === "j") cards[Math.min(cards.length - 1, i + 1)]?.scrollIntoView();
  else if (e.key === "k") cards[Math.max(0, i - 1)]?.scrollIntoView();
  else if (e.key === "p") document.querySelectorAll(".toggle")[i]?.click();
  else if (e.key === "s") window.open(`${problemUrl(subject, problems[i].id)}&fast=1`, "_blank");
});
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
